<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkinChanger Android</title>
<style>
body {
  background: #10131c;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
h1 { color: #ff5733; }
.card {
  background: #222938;
  padding: 20px;
  margin: 15px 0;
  border-radius: 15px;
}
button {
  background: #ff5733;
  color: white;
  border: 0;
  padding: 13px 25px;
  border-radius: 9px;
  font-size: 16px;
}
</style>
</head>
<body>

<h1>SKIN CHANGER</h1>
<p>Personalização visual Android</p>

<div class="card">
<h2>AK-47</h2>
<p>Skin: Red Dragon</p>
<button onclick="alert('Pré-visualização selecionada!')">
Selecionar
</button>
</div>

<div class="card">
<h2>AWP</h2>
<p>Skin: Dragon Lore</p>
<button onclick="alert('Pré-visualização selecionada!')">
Selecionar
</button>
</div>

<div class="card">
<h2>Desert Eagle</h2>
<p>Skin: Blaze</p>
<button onclick="alert('Pré-visualização selecionada!')">
Selecionar
</button>
</div>

</body>
</html>
